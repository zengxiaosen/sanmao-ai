# 使用 Tiingo 真实日线 + GDELT 免费新闻标题/来源元数据的 baseline。
# GDELT 免费且无需 token，但 ticker 关联和正文质量不如付费金融新闻源。

market: "US"
strategy_id: "us_gdelt_rule_text_xgboost_v1"

symbols:
  - AAPL.US
  - MSFT.US
  - NVDA.US
  - SPY.US

start_date: "2024-01-01"
end_date: "2026-05-29"

data_dir: "/root/sanmao-ai/sanmao-llm/data/us_gdelt_rule_text_xgboost_v1"
report_dir: "/root/sanmao-ai/sanmao-llm/reports/us_gdelt_rule_text_xgboost_v1"
model_dir: "/root/sanmao-ai/sanmao-llm/models/us_gdelt_rule_text_xgboost_v1"

allow_synthetic_fallback: false
market_data_provider: "tiingo"

prediction_horizon_days: 1
train_window_days: 252
test_window_days: 63
min_train_rows: 500
probability_threshold: 0.55
transaction_cost_bps: 5

model:
  kind: "xgboost"
  n_estimators: 200
  max_depth: 3
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8

text_features:
  enabled: true
  news_csv: "/root/sanmao-ai/sanmao-llm/data/us_gdelt_rule_text_xgboost_v1/news/gdelt_news.csv"
